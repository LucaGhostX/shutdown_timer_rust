app-id: io.github.lucag.ShutdownTimer
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: shutdown_timer

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --system-talk-name=org.freedesktop.login1

modules:
  - name: shutdown_timer
    buildsystem: simple
    build-commands:
      - install -Dm755 shutdown_timer /app/bin/shutdown_timer
      - install -Dm644 io.github.lucag.ShutdownTimer.desktop /app/share/applications/io.github.lucag.ShutdownTimer.desktop
      - install -Dm644 power_icon.png /app/share/icons/hicolor/256x256/apps/io.github.lucag.ShutdownTimer.png
      - install -Dm644 io.github.lucag.ShutdownTimer.metainfo.xml /app/share/metainfo/io.github.lucag.ShutdownTimer.metainfo.xml
    sources:
      - type: file
        path: ../../target/release/shutdown_timer
      - type: file
        path: ../../installer/linux/io.github.lucag.ShutdownTimer.desktop
      - type: file
        path: ../../assets/power_icon.png
      - type: file
        path: ../../installer/linux/io.github.lucag.ShutdownTimer.metainfo.xml


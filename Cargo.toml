[package]
name = "shutdown_timer"
version = "2.4.0"
edition = "2021"
description = "A simple, small program for creating a shutdown timer written in Rust"
license = "MIT"
authors = ["LucaGhostX"]

[dependencies]
eframe = { version = "0.37.0", default-features = true }

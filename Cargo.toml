[package]
name = "shutdown_timer"
version = "2.4.0"
edition = "2021"
description = "A fast, native shutdown timer in Rust (vibecoded port of https://github.com/LucaGhostX/shutdown_timer)"
license = "MIT"
authors = ["LucaGhostX"]
repository = "https://github.com/LucaGhostX/shutdown_timer_rust"

[dependencies]
eframe = { version = "0.37.0", default-features = true }
egui = { version = "0.37.0", default-features = true }
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }





